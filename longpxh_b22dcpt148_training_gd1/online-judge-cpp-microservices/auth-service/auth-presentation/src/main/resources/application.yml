spring:
  application:
    name: auth-service
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Server Configuration
server:
  port: 8081

# JWT Configuration
jwt:
  secret: your-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-please-change-this-in-production

# Logging
logging:
  level:
    root: INFO
    com.ojcpp.auth: DEBUG
    org.hibernate.SQL: DEBUG
