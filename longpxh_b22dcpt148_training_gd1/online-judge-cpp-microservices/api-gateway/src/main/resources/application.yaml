server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true  # Tự động tạo routes từ Eureka
          lower-case-service-id: true  # URL lowercase
      routes:
        # Route cho C++ Judge Service (không có trong Eureka)
        - id: judge-service
          uri: http://localhost:8084  # Địa chỉ Judge Service
          predicates:
            - Path=/judge/**
          filters:
            - StripPrefix=1  # Bỏ /judge khỏi path
# Đăng ký với Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
# Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway