spring:
  datasource:
    url: jdbc:postgresql://submission-db:5432/submission_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
  cloud:
    config:
      enabled: false

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    hostname: submission-service
    instance-id: ${spring.application.name}:${random.value}
